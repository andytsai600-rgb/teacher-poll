<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研習即時互動調查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8 flex flex-col items-center">

  <header class="w-full max-w-4xl flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900">研習成員現況調查</h1>
      <p class="text-sm text-slate-500 mt-1">免登入・多科目自填即時統計</p>
    </div>
    <button id="toggleRoleBtn" class="bg-slate-800 hover:bg-slate-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg transition font-medium">
      切換至手機填答模式
    </button>
  </header>

  <main class="w-full max-w-4xl">
    <!-- 1. 大螢幕投影 -->
    <div id="presenterSection" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center text-center">
          <span class="text-xs font-semibold px-2.5 py-1 bg-blue-100 text-blue-700 rounded-full mb-3">手機掃描立即填寫</span>
          <div id="qrcode" class="p-2 border border-slate-100 rounded-xl bg-white shadow-inner"></div>
          <p class="text-xs text-slate-400 mt-3 break-all font-mono" id="joinUrlText"></p>
          <div class="mt-4 pt-4 border-t border-slate-100 w-full">
            <span class="text-slate-500 text-sm">已完成填答人數</span>
            <div class="text-3xl font-black text-blue-600 mt-1" id="totalSubmissions">0 <span class="text-base font-normal text-slate-400">人</span></div>
          </div>
        </div>

        <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
          <div class="flex items-center justify-between gap-3 mb-2">
            <h2 class="text-base font-bold text-slate-700">即時統計儀表板</h2>
            <button id="resetStatsBtn" type="button"
              class="text-xs font-semibold text-red-600 hover:text-white hover:bg-red-600 border border-red-200 px-3 py-2 rounded-lg transition">
              清除本輪紀錄
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 h-72">
            <div class="relative h-full flex flex-col items-center">
              <span class="text-xs font-semibold text-slate-600 mb-1">教學年資分佈（年）</span>
              <div class="relative w-full flex-1">
                <canvas id="presenterYearChart"></canvas>
              </div>
            </div>
            <div class="relative h-full flex flex-col items-center">
              <span class="text-xs font-semibold text-slate-600 mb-1">授課科目分佈（可複選）</span>
              <div class="relative w-full flex-1">
                <canvas id="presenterSubjectChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 手機填答 -->
    <div id="participantSection" class="hidden max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-900">填寫您的教學資訊</h2>
        <p class="text-xs text-slate-500 mt-1">若任教多個科目，可依序新增填入</p>
      </div>

      <form id="pollForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">1. 教學年資（年）</label>
          <input type="number" id="inputYears" min="0" max="50" required placeholder="例：3、10" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">2. 任教科別 / 領域</label>
          <div id="subjectInputsContainer" class="space-y-2">
            <div class="flex items-center gap-2">
              <input type="text" class="subject-input w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" 
                placeholder="科目一（例：數學）" required>
            </div>
          </div>
          
          <button type="button" id="addSubjectBtn" class="mt-2 text-xs font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1">
            <span>＋ 新增其他任教科別</span>
          </button>
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-xl transition shadow-sm mt-4">
          送出資料
        </button>
      </form>

      <div id="successCard" class="hidden text-center py-6">
        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">✓</div>
        <h3 class="text-lg font-bold text-slate-900">送出成功！</h3>
        <p class="text-sm text-slate-500 mt-1">請抬頭觀看大螢幕即時統計彙整。</p>
      </div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('room');
    const isClient = !!hostId;

    let peer, conn, yearChart, subjectChart;
    const stats = { years: {}, subjects: {}, total: 0 };

    const presenterSection = document.getElementById('presenterSection');
    const participantSection = document.getElementById('participantSection');
    const toggleRoleBtn = document.getElementById('toggleRoleBtn');
    const subjectInputsContainer = document.getElementById('subjectInputsContainer');
    const addSubjectBtn = document.getElementById('addSubjectBtn');
    const resetStatsBtn = document.getElementById('resetStatsBtn');
    const RESET_PIN = '0000';

    let subjectCount = 1;
    addSubjectBtn.addEventListener('click', () => {
      subjectCount++;
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2';
      div.innerHTML = `
        <input type="text" class="subject-input w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" 
          placeholder="科目 ${subjectCount}">
        <button type="button" class="text-slate-400 hover:text-red-500 px-2 py-1 text-sm remove-btn">✕</button>
      `;
      div.querySelector('.remove-btn').addEventListener('click', () => div.remove());
      subjectInputsContainer.appendChild(div);
    });

    function initCharts() {
      const ctxY = document.getElementById('presenterYearChart').getContext('2d');
      yearChart = new Chart(ctxY, {
        type: 'bar',
        data: { labels: [], datasets: [{ data: [], backgroundColor: '#3b82f6', borderRadius: 6 }] },
        options: { 
          responsive: true, 
          maintainAspectRatio: false, 
          plugins: { legend: { display: false } }, 
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } 
        }
      });

      const ctxS = document.getElementById('presenterSubjectChart').getContext('2d');
      subjectChart = new Chart(ctxS, {
        type: 'bar',
        data: { labels: [], datasets: [{ data: [], backgroundColor: '#10b981', borderRadius: 6 }] },
        options: { 
          indexAxis: 'y',
          responsive: true, 
          maintainAspectRatio: false, 
          plugins: { legend: { display: false } }, 
          scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } 
        }
      });
    }

    function updateDashboard() {
      document.getElementById('totalSubmissions').innerHTML = `${stats.total} <span class="text-base font-normal text-slate-400">人</span>`;
      
      const yearLabels = Object.keys(stats.years).sort((a, b) => Number(a) - Number(b));
      yearChart.data.labels = yearLabels.map(l => l + ' 年');
      yearChart.data.datasets[0].data = yearLabels.map(k => stats.years[k]);
      yearChart.update();

      const subLabels = Object.keys(stats.subjects).sort((a, b) => stats.subjects[b] - stats.subjects[a]);
      subjectChart.data.labels = subLabels;
      subjectChart.data.datasets[0].data = subLabels.map(k => stats.subjects[k]);
      subjectChart.update();
    }

    function recordSubmission(data) {
      if (data.years === '' || !Array.isArray(data.subjects) || data.subjects.length === 0) return;
      stats.years[data.years] = (stats.years[data.years] || 0) + 1;
      data.subjects.forEach(sub => {
        if (sub) stats.subjects[sub] = (stats.subjects[sub] || 0) + 1;
      });
      stats.total += 1;
      updateDashboard();
    }

    function showSuccess() {
      document.getElementById('pollForm').classList.add('hidden');
      document.getElementById('successCard').classList.remove('hidden');
    }

    function resetStats() {
      const enteredPin = window.prompt('請輸入主持人密碼：');
      if (enteredPin === null) return;
      if (enteredPin !== RESET_PIN) {
        window.alert('密碼不正確，紀錄沒有被清除。');
        return;
      }
      const confirmed = window.confirm('確定要清除目前所有填答紀錄嗎？\n清除後無法復原。');
      if (!confirmed) return;

      stats.years = {};
      stats.subjects = {};
      stats.total = 0;
      updateDashboard();
      document.getElementById('pollForm').reset();
      document.getElementById('pollForm').classList.remove('hidden');
      document.getElementById('successCard').classList.add('hidden');
      window.alert('所有紀錄已清除，可以開始新一輪填答。');
    }

    document.getElementById('pollForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const years = document.getElementById('inputYears').value;
      const subjects = Array.from(document.querySelectorAll('.subject-input'))
        .map(input => input.value.trim())
        .filter(val => val.length > 0);
      const data = { years, subjects };

      if (!isClient) {
        recordSubmission(data);
        showSuccess();
      } else if (conn && conn.open) {
        conn.send(data);
        showSuccess();
      } else {
        window.alert('仍在連線主機，請稍候幾秒後再試一次。');
      }
    });

    if (!isClient) {
      initCharts();
      resetStatsBtn.addEventListener('click', resetStats);
      peer = new Peer();

      peer.on('open', (id) => {
        const joinUrl = `${window.location.origin}${window.location.pathname}?room=${id}`;
        document.getElementById('joinUrlText').innerText = joinUrl;
        
        new QRCode(document.getElementById("qrcode"), {
          text: joinUrl,
          width: 140,
          height: 140
        });
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          recordSubmission(data);
        });
      });

      toggleRoleBtn.addEventListener('click', () => {
        presenterSection.classList.toggle('hidden');
        participantSection.classList.toggle('hidden');
        toggleRoleBtn.innerText = presenterSection.classList.contains('hidden') ? '切換至大螢幕展示' : '切換至手機填答模式';
      });

    } else {
      presenterSection.classList.add('hidden');
      participantSection.classList.remove('hidden');
      toggleRoleBtn.classList.add('hidden');

      peer = new Peer();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '連線中…';

      peer.on('open', () => {
        conn = peer.connect(hostId);
        conn.on('open', () => {
          submitBtn.disabled = false;
          submitBtn.innerText = '送出資料';
        });
      });
    }
  </script>
</body>
</html>
